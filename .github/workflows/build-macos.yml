name: build-macos

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade nuitka ordered-set zstandard pywebview \
              pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-Quartz pyobjc-framework-WebKit

      - name: Download static ffmpeg/ffprobe
        run: |
          mkdir -p tools_mac

          # Статические билды с evermeet.cx (не линкуются с homebrew).
          # Сборки x86_64; на arm64 работают через Rosetta.
          FFMPEG_URL="https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip"
          FFPROBE_URL="https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip"
          UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)"

          curl -L -f --retry 5 --retry-delay 10 -A "$UA" -o ffmpeg.zip "$FFMPEG_URL"
          curl -L -f --retry 5 --retry-delay 10 -A "$UA" -o ffprobe.zip "$FFPROBE_URL"

          unzip -o ffmpeg.zip -d tools_mac/
          unzip -o ffprobe.zip -d tools_mac/
          rm -f ffmpeg.zip ffprobe.zip

          ls -lh tools_mac/

      - name: Download exiftool (full distribution with lib/)
        run: |
          # Актуальная версия берётся с сайта автоматически
          EXIFVER="$(curl -L -f -s https://exiftool.org/ver.txt | tr -d '[:space:]')"
          echo "ExifTool version: ${EXIFVER}"

          curl -L -f --retry 5 --retry-delay 10 \
            -o exiftool.tar.gz "https://exiftool.org/Image-ExifTool-${EXIFVER}.tar.gz"

          tar xzf exiftool.tar.gz

          mkdir -p tools_mac/lib
          cp "Image-ExifTool-${EXIFVER}/exiftool" tools_mac/exiftool.pl
          cp -R "Image-ExifTool-${EXIFVER}/lib/"* tools_mac/lib/

          # Wrapper, чтобы exiftool нашёл свои модули (без heredoc)
          printf '%s\n' \
            '#!/bin/bash' \
            'DIR="$(cd "$(dirname "$0")" && pwd)"' \
            'exec /usr/bin/perl -I "$DIR/lib" "$DIR/exiftool.pl" "$@"' \
            > tools_mac/exiftool
          chmod +x tools_mac/exiftool

          rm -rf exiftool.tar.gz "Image-ExifTool-${EXIFVER}"

          ls -lh tools_mac/

      - name: Prepare tools_mac.zip
        run: |
          chmod +x prep_tools_simple.sh build_mac.sh
          ./prep_tools_simple.sh

      - name: Build .app (Nuitka)
        run: ./build_mac.sh

      - name: Pack
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/MetaMask US.app" \
            "MetaMaskUS-macOS-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaMaskUS-macOS-${{ matrix.arch }}
          path: MetaMaskUS-macOS-${{ matrix.arch }}.zip
          retention-days: 30

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MetaMaskUS-macOS-${{ matrix.arch }}.zip
