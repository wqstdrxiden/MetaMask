name: build-macos

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download macOS tools (ffmpeg / ffprobe / exiftool)
        run: |
          mkdir -p tools_mac
          
          # Скачиваем ffmpeg и ffprobe с User-Agent (evermeet блокирует обычные curl)
          curl -L --retry 3 --retry-delay 5 -A "Mozilla/5.0" \
            -o ffmpeg.zip "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" || {
            echo "evermeet.cx недоступен, используем альтернативный источник..."
            curl -L --retry 3 -o ffmpeg.zip "https://www.osxexperts.net/ffmpeg7intel.zip"
          }
          
          curl -L --retry 3 --retry-delay 5 -A "Mozilla/5.0" \
            -o ffprobe.zip "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip" || {
            echo "evermeet.cx недоступен для ffprobe..."
            curl -L --retry 3 -o ffprobe.zip "https://www.osxexperts.net/ffprobe7intel.zip"
          }
          
          unzip -o ffmpeg.zip -d tools_mac
          unzip -o ffprobe.zip -d tools_mac
          
          # Скачиваем exiftool
          EXIFVER=13.00
          curl -L --retry 3 -o exiftool.tar.gz "https://exiftool.org/Image-ExifTool-${EXIFVER}.tar.gz"
          tar xzf exiftool.tar.gz
          mv "Image-ExifTool-${EXIFVER}" exiftool_src

      - name: Prepare tools_mac.zip
        run: |
          chmod +x prep_tools_mac.sh build_mac.sh
          ./prep_tools_mac.sh

      - name: Build .app (Nuitka)
        run: ./build_mac.sh

      - name: Pack (ditto сохраняет codesign)
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/MetaMask US.app" \
            "MetaMaskUS-macOS-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaMaskUS-macOS-${{ matrix.arch }}
          path: MetaMaskUS-macOS-${{ matrix.arch }}.zip
          retention-days: 30

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MetaMaskUS-macOS-${{ matrix.arch }}.zip