name: build-macos

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install macOS tools via Homebrew
        run: |
          echo "Устанавливаем ffmpeg и exiftool через Homebrew..."
          brew install ffmpeg exiftool
          
          mkdir -p tools_mac
          
          FFMPEG_PREFIX="$(brew --prefix ffmpeg)"
          cp "$FFMPEG_PREFIX/bin/ffmpeg" tools_mac/
          cp "$FFMPEG_PREFIX/bin/ffprobe" tools_mac/
          
          EXIFTOOL_PATH="$(which exiftool)"
          if [ -z "$EXIFTOOL_PATH" ]; then
            echo "ОШИБКА: exiftool не найден в PATH"
            exit 1
          fi
          cp "$EXIFTOOL_PATH" tools_mac/
          
          ls -lh tools_mac/
          
          mkdir -p exiftool_src
          touch exiftool_src/.placeholder

      - name: Prepare tools_mac.zip
        run: |
          chmod +x build_mac.sh
          
          cat > prep_tools_simple.sh <<'PREP_SCRIPT'
#!/bin/bash
set -euo pipefail
cd "$(dirname "$0")"

[ -f "tools_mac/ffmpeg" ] || { echo "ОШИБКА: tools_mac/ffmpeg не найден"; exit 1; }
[ -f "tools_mac/ffprobe" ] || { echo "ОШИБКА: tools_mac/ffprobe не найден"; exit 1; }
[ -f "tools_mac/exiftool" ] || { echo "ОШИБКА: tools_mac/exiftool не найден"; exit 1; }

chmod +x tools_mac/ffmpeg tools_mac/ffprobe tools_mac/exiftool
chmod -R +r tools_mac

codesign --force --sign - tools_mac/ffmpeg  || true
codesign --force --sign - tools_mac/ffprobe || true
codesign --force --sign - tools_mac/exiftool || true

rm -f tools_mac.zip
(cd tools_mac && zip -q -r ../tools_mac.zip .)
echo "ГОТОВО: tools_mac.zip ($(du -h tools_mac.zip | cut -f1))"
PREP_SCRIPT
          
          chmod +x prep_tools_simple.sh
          ./prep_tools_simple.sh

      - name: Build .app (Nuitka)
        run: ./build_mac.sh

      - name: Pack (ditto сохраняет codesign)
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/MetaMask US.app" \
            "MetaMaskUS-macOS-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaMaskUS-macOS-${{ matrix.arch }}
          path: MetaMaskUS-macOS-${{ matrix.arch }}.zip
          retention-days: 30

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MetaMaskUS-macOS-${{ matrix.arch }}.zip